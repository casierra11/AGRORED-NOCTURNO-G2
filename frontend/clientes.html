<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Clientes - AgroRed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="barra">
    <div class="barra-superior">
      <div class="marca">AgroRed · Gestión Logística</div>
      <div class="persona">
        <div>
          <span id="nombre-usuario" style="font-weight: 600;">Cargando...</span>
          <span class="rol" id="rol-usuario"></span>
        </div>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu">
      <a href="pedidos.html">Pedidos</a>
      <a href="clientes.html" aria-current="page">Clientes</a>
      <a href="productos.html">Productos</a>
      <a href="lotes.html">Lotes</a>
      <a href="usuarios.html">Usuarios</a>
    </nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Clientes</h1>
        <p class="resumen" id="resumen">Cargando clientes...</p>
      </div>
      <div class="herramientas">
        <select id="filtro-tipo" style="padding: 0.55rem 0.8rem; border-radius: 8px; border: 1px solid #cbd5e1;">
          <option value="">Todos los tipos</option>
          <option value="comercio">Comercio</option>
          <option value="distribuidor">Distribuidor</option>
        </select>
        <input type="search" id="busqueda-cliente" placeholder="Buscar por nombre, NIT o ciudad...">
        <button class="boton" id="nuevo">Nuevo cliente</button>
      </div>
    </div>

    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre / Razón Social</th>
            <th>NIT</th>
            <th>Ciudad</th>
            <th>Teléfono</th>
            <th>Tipo</th>
            <th style="text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <div id="mensajes" aria-live="polite"></div>

  <dialog id="dialogo" style="border: none; border-radius: 12px; padding: 1.5rem; max-width: 460px; width: 92%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);">
    <form id="form-cliente" method="dialog" style="display: flex; flex-direction: column; gap: 1rem;">
      <h2 id="titulo-dialogo" style="margin: 0; font-size: 1.25rem;">Nuevo cliente</h2>

      <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
        <span>Nombre o Razón Social</span>
        <input name="nombre" type="text" maxlength="100" required placeholder="Ej: Supermercados del Valle" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
      </label>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>NIT / Documento</span>
          <input name="nit" type="text" maxlength="20" required placeholder="Ej: 900123456-1" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
        </label>

        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>Tipo de Cliente</span>
          <select name="tipo" required style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            <option value="">Selecciona…</option>
            <option value="comercio">Comercio</option>
            <option value="distribuidor">Distribuidor</option>
          </select>
        </label>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>Ciudad</span>
          <input name="ciudad" type="text" maxlength="50" required placeholder="Ej: Cali" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
        </label>

        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>Teléfono</span>
          <input name="telefono" type="text" maxlength="20" required placeholder="Ej: 3104567890" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
        <button type="button" id="btn-cancelar" style="padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">Cancelar</button>
        <button type="submit" id="btn-guardar" class="boton">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
