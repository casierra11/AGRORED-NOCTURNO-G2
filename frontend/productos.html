<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos - AgroRed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="barra">
    <div class="barra-superior">
      <div class="marca">AgroRed · Gestión Logística</div>
      <div class="persona">
        <div>
          <span id="nombre-usuario" style="font-weight: 600;">Cargando...</span>
          <span class="rol" id="rol-usuario"></span>
        </div>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu">
      <a href="pedidos.html">Pedidos</a>
      <a href="productos.html" aria-current="page">Productos</a>
      <a href="usuarios.html">Usuarios</a>
    </nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Productos</h1>
        <p class="resumen" id="resumen">Cargando productos...</p>
      </div>
      <div class="herramientas">
        <select id="filtro-categoria" style="padding: 0.55rem 0.8rem; border-radius: 8px; border: 1px solid #cbd5e1;">
          <option value="">Todas las categorías</option>
          <option value="fruta">Fruta</option>
          <option value="hortaliza">Hortaliza</option>
          <option value="procesado">Procesado</option>
        </select>
        <input type="search" id="busqueda-nombre" placeholder="Buscar por nombre...">
        <button class="boton" id="nuevo">Nuevo producto</button>
      </div>
    </div>

    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Unidad</th>
            <th>Precio (COP)</th>
            <th style="text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <div id="mensajes" aria-live="polite"></div>

  <dialog id="dialogo" style="border: none; border-radius: 12px; padding: 1.5rem; max-width: 440px; width: 92%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);">
    <form id="form-producto" method="dialog" style="display: flex; flex-direction: column; gap: 1rem;">
      <h2 id="titulo-dialogo" style="margin: 0; font-size: 1.25rem;">Nuevo producto</h2>

      <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
        <span>Nombre</span>
        <input name="nombre" type="text" maxlength="100" required placeholder="Ej: Aguacate Hass" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
      </label>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>Categoría</span>
          <select name="categoria" required style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            <option value="">Selecciona…</option>
            <option value="fruta">Fruta</option>
            <option value="hortaliza">Hortaliza</option>
            <option value="procesado">Procesado</option>
          </select>
        </label>

        <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
          <span>Unidad</span>
          <select name="unidad" required style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            <option value="">Selecciona…</option>
            <option value="kg">kg</option>
            <option value="caja">caja</option>
          </select>
        </label>
      </div>

      <label style="display: flex; flex-direction: column; gap: 0.35rem; font-weight: 500;">
        <span>Precio (COP)</span>
        <input name="precio" type="number" step="0.01" min="0.01" required placeholder="Ej: 4500" style="padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 8px;">
      </label>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
        <button type="button" id="btn-cancelar" style="padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">Cancelar</button>
        <button type="submit" id="btn-guardar" class="boton">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
