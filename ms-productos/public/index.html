<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgroRed · Catálogo de productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🌱</span>
      <div>
        <h1>AgroRed</h1>
        <p>Catálogo de productos</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="status" class="status" data-state="checking" title="Estado del microservicio">
        <span class="dot"></span><span id="status-text">Verificando…</span>
      </span>
      <button id="btn-settings" class="btn btn-ghost" type="button" aria-label="Configuración de conexión">⚙︎ Conexión</button>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Resumen">
      <div class="stat"><span class="stat-label">Productos</span><strong id="stat-total">0</strong></div>
      <div class="stat"><span class="stat-label">Precio promedio</span><strong id="stat-avg">—</strong></div>
      <div class="stat"><span class="stat-label">Más caro</span><strong id="stat-max">—</strong></div>
    </section>

    <section class="toolbar" aria-label="Filtros">
      <div class="search">
        <input id="q" type="search" placeholder="Buscar por nombre…" autocomplete="off" />
      </div>

      <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría">
        <button class="chip is-active" data-cat="" type="button">Todas</button>
        <button class="chip" data-cat="fruta" type="button">🍎 Fruta</button>
        <button class="chip" data-cat="hortaliza" type="button">🥬 Hortaliza</button>
        <button class="chip" data-cat="procesado" type="button">🫙 Procesado</button>
      </div>

      <form id="ids-form" class="ids-form" autocomplete="off">
        <input id="ids" type="text" inputmode="numeric" placeholder="IDs: 1,3,8" aria-label="Consultar por IDs separados por coma" />
        <button class="btn btn-ghost" type="submit">Consultar</button>
        <button id="ids-clear" class="btn btn-ghost" type="button" hidden>Limpiar</button>
      </form>

      <button id="btn-new" class="btn btn-primary" type="button">+ Nuevo producto</button>
    </section>

    <div id="banner" class="banner" role="alert" hidden></div>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <div class="empty-emoji">🧺</div>
      <h2>No hay productos para mostrar</h2>
      <p>Prueba con otro filtro o crea el primer producto.</p>
    </div>

    <div id="loading" class="loading" hidden>Cargando productos…</div>
  </main>

  <!-- Crear / editar -->
  <dialog id="dlg-form">
    <form id="form" method="dialog" novalidate>
      <header class="dlg-head">
        <h2 id="form-title">Nuevo producto</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>

      <label class="field">
        <span>Nombre</span>
        <input name="nombre" type="text" maxlength="100" required placeholder="Ej: Aguacate Hass" />
        <small class="err" data-for="nombre"></small>
      </label>

      <div class="row">
        <label class="field">
          <span>Categoría</span>
          <select name="categoria" required>
            <option value="">Selecciona…</option>
            <option value="fruta">Fruta</option>
            <option value="hortaliza">Hortaliza</option>
            <option value="procesado">Procesado</option>
          </select>
          <small class="err" data-for="categoria"></small>
        </label>

        <label class="field">
          <span>Unidad</span>
          <select name="unidad" required>
            <option value="">Selecciona…</option>
            <option value="kg">kg</option>
            <option value="caja">caja</option>
          </select>
          <small class="err" data-for="unidad"></small>
        </label>
      </div>

      <label class="field">
        <span>Precio (COP)</span>
        <input name="precio" type="number" step="0.01" min="0" inputmode="decimal" required placeholder="0" />
        <small class="err" data-for="precio"></small>
      </label>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <footer class="dlg-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button id="form-submit" type="submit" class="btn btn-primary">Guardar</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirmar eliminación -->
  <dialog id="dlg-delete">
    <form method="dialog">
      <header class="dlg-head"><h2>Eliminar producto</h2></header>
      <p id="delete-text" class="dlg-text"></p>
      <footer class="dlg-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button id="delete-confirm" type="button" class="btn btn-danger">Sí, eliminar</button>
      </footer>
    </form>
  </dialog>

  <!-- Conexión -->
  <dialog id="dlg-settings">
    <form id="settings-form" method="dialog">
      <header class="dlg-head">
        <h2>Conexión con la API</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </header>

      <label class="field">
        <span>URL base del microservicio</span>
        <input id="set-base" type="text" placeholder="http://localhost:3002" />
        <small class="hint">Déjala vacía si sirves este front desde el mismo Express.</small>
      </label>

      <label class="field">
        <span>Token JWT (opcional)</span>
        <input id="set-token" type="password" placeholder="Pega aquí tu token Bearer" autocomplete="off" />
        <small class="hint">Se envía como <code>Authorization: Bearer …</code> y se guarda solo en este navegador.</small>
      </label>

      <footer class="dlg-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
